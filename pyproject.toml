[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "spicebind"
version = "0.0.3"
description = "SpiceBind is a bridge that embeds the ngspice analog engine inside VPI-capable Verilog simulator for mixed-signal co-simulation."
authors = [{name = "Tomasz Hemperek"}]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "cocotb>=2",
    "numpy",
    "matplotlib",
    "cocotbext-spi",
    "tomli",
]

docs = [
    "sphinx>=8.2",
    "breathe",
    "sphinx-book-theme==1.1.3",  # pin this to exact version to guard against any CSS changes
    "sphinx-design>=0.6.1",
    "sphinxcontrib-spelling>=5.3.0",
    "pyenchant",
    "sphinx-argparse-cli",
    "sphinx-autobuild",
    "sphinx-codeautolink",
    "myst-parser",
    "sphinxcontrib-mermaid",
]

[project.scripts]
spicebind-vpi-path = "spicebind.cli:main"

[project.urls]
Homepage = "https://github.com/themperek/spicebind"
Repository = "https://github.com/themperek/spicebind"

[tool.scikit-build]
# Specify the CMake version
cmake.version = ">=3.15"
# Use ninja generator for faster builds
ninja.version = ">=1.10"
# GitHub is the home for these; pip only needs C++/CMake/Python to build the VPI.
sdist.exclude = ["tests/", "docs/", "examples/", ".github/"]

[tool.scikit-build.cmake.define]
NGSPICE_ROOT = {env = "NGSPICE_ROOT"}

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
